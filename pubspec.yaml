name: ai_admin_panel
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Icons.adaptive (стрелки «назад» и т.п.) на iOS/macOS рисуются
  # шрифтом CupertinoIcons - без пакета вместо иконки пустой квадрат
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.1.1
  intl: ^0.20.3
  file_picker: ^12.3.0
  image_picker: ^1.2.3
  audioplayers: ^6.1.0
  pdf: ^3.11.1
  share_plus: ^13.0.0
  local_auth: ^3.0.2
  encrypt: ^5.0.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

# Иконка приложения — та же фирменная, но админ-панель узнаваема по
# отдельной записи в списке приложений на устройстве
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFD166"
  min_sdk_android: 21
  adaptive_icon_background: "#FFD166"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B0F1E"
    theme_color: "#FFD166"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

# см. подробный комментарий в flutter_app/pubspec.yaml - тот же приём,
# файл assets/icon/splash_logo.png уже существовал, просто не был
# подключён. Сгенерировать: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0F1E"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0B0F1E"
    image: assets/icon/splash_logo.png
