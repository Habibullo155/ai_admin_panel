name: ai_admin_panel
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  intl: ^0.19.0
  file_picker: ^8.1.3
  image_picker: ^1.2.3
  audioplayers: ^6.1.0
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.1.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Иконка приложения — та же фирменная, но админ-панель узнаваема по
# отдельной записи в списке приложений на устройстве
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B0F1E"
    theme_color: "#6C5CE7"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
