name: Deploy Flutter Web to GitHub Pages


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # адрес API не секрет (его видно в браузере) - задан прямо здесь
      - name: Build web (with backend URL baked in)
        env:
          BACKEND_URL: https://api.lomalu.ru
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=BACKEND_URL=$BACKEND_URL \
            --base-href /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4